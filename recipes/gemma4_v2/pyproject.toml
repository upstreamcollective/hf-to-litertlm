[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
no-build = true
prerelease = "allow"
# The CLI's builder proto imports are also provided by the pinned nightly.
# Installing both distributions would overwrite the same litert_lm_builder files.
exclude-dependencies = ["litert-lm-builder"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
